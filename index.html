<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aroza Fotografia</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- =========================
         CABEÇALHO
         ========================= -->

    <header>

        <a href="index.html" class="logo">
         Aroza Fotografia
        </a>

        <div class="cabecalho-menu">

            <span class="pagina-atual">
                Início
            </span>

            <nav class="menu-links" aria-label="Navegação principal">
                <ul>

                    <li>
                        <a href="index.html" class="ativo" aria-current="page">
                            Início
                        </a>
                    </li>

                    <li>
                        <a href="sobre.html">
                            Sobre
                        </a>
                    </li>

                    <li>
                        <a href="acervo.html">
                            Acervo
                        </a>
                    </li>

                    <li>
                        <a href="contato.html">
                            Contato
                        </a>
                    </li>

                </ul>
            </nav>

            <button
                class="menu-toggle"
                type="button"
                aria-label="Abrir menu"
                aria-expanded="false"
            >
                <span class="ponto"></span>
                <span class="ponto"></span>
                <span class="ponto"></span>
            </button>

        </div>

    </header>


    <!-- =========================
         HERO
         ========================= -->

    <section class="hero" id="inicio">

        <div class="hero-content">

            <h1>
                Aroza Fotografia
            </h1>

            <p>
                Fotografia com foco na essência.
            </p>

        </div>

    </section>


    <!-- =========================
         ÚLTIMOS ENSAIOS
         =========================

    Os trabalhos desta seção são escolhidos manualmente
    como destaques da página inicial.

    O Acervo contém todos os trabalhos publicados.
    -->

    <section class="ultimos-ensaios">

        <div class="secao-titulo">

            <span>
                ACERVO
            </span>

            <h2>
                Últimos ensaios
            </h2>

        </div>


        <div class="ensaios">

            <!-- =========================
                 CARD 1
                 ========================= -->

            <a
                href="card1.html"
                class="ensaio-card ensaio-principal"
            >

                <img
                    src="imagens/inicio/retrato-gabriel-molina.jpeg"
                    alt="Ensaio de retrato de Gabriel Molina"
                >

                <div class="ensaio-overlay">

                    <span>
                        RETRATO
                    </span>

                    <h3>
                        Gabriel Molina
                    </h3>

                </div>

            </a>


            <!-- =========================
                 CARD 2
                 ========================= -->

            <a
                href="card2.html"
                class="ensaio-card"
            >

                <img
                    src="imagens/inicio/ims-av.paulista.jpeg"
                    alt="Ensaio no IMS Avenida Paulista"
                >

                <div class="ensaio-overlay">

                    <span>
                        ENSAIO
                    </span>

                    <h3>
                        IMS — Avenida Paulista
                    </h3>

                </div>

            </a>


            <!-- =========================
                 CARD 3
                 ========================= -->

            <a
                href="card3.html"
                class="ensaio-card"
            >

                <img
                    src="imagens/inicio/showcrazy-centrohistorico.jpeg"
                    alt="Ensaio Showcrazy no Centro Histórico"
                >

                <div class="ensaio-overlay">

                    <span>
                        ENSAIO
                    </span>

                    <h3>
                        Showcrazy — Centro Histórico
                    </h3>

                </div>

            </a>

        </div>

    </section>


    <!-- =========================
         RODAPÉ
         ========================= -->

    <footer>

        <p>
            &copy; 2026 Aroza Fotografia |
            Todos os direitos reservados
        </p>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
